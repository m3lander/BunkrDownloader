[project]
name = "bunkrdownloader"
version = "1.3.4"
description = "Python-based downloader for Bunkr albums and files."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Lysagxra" }]
keywords = ["bunkr", "downloader", "cli", "albums"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "Requests==2.34.2",
    "rich==15.0.0",
]

[project.urls]
Upstream = "https://github.com/Lysagxra/BunkrDownloader"
Fork = "https://github.com/m3lander/BunkrDownloader"

[project.scripts]
bunkr = "_bunkr_cli:download"
bunkr-batch = "_bunkr_cli:batch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src", "downloader.py", "main.py", "_bunkr_cli.py"]
